# Remap prefix from C-b to C-a (easier reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support - click to switch panes, drag to resize, scroll to scroll
set -g mouse on

# 1-indexed panes/windows
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Intuitive split bindings, open in current pane's path
# v = vertical divider (side by side), s = stacked (top/bottom)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind |
unbind -

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# prefix s is taken by the stacked-split binding above, so put the
# interactive session chooser (tmux's default "prefix s") on capital S
bind S choose-tree -Zs

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key m display-popup -w 80% -h 30% -E "~/.cargo/bin/claude-tmux"

# Ghostty true-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"

# Increase scrollback
set -g history-limit 50000

# Faster escape (helps vim/nvim inside tmux)
set -sg escape-time 10

# Project sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Cheatsheet popup (q or prefix again to dismiss)
bind-key ? display-popup -w 80% -h 80% -E "bat --paging=always --style=plain ~/.config/tmux/cheatsheet.md 2>/dev/null || less ~/.config/tmux/cheatsheet.md"

# Pane borders: show running command per pane, highlight the active pane
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=colour238"

# Highlight windows with activity/bell in the status bar
setw -g monitor-activity on
set -g visual-activity on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# tmux-fzf: prefix F opens the fzf launcher (sessions/windows/panes/etc)
TMUX_FZF_LAUNCH_KEY="F"

# catppuccin status bar: show date/time on the right
set -g @catppuccin_status_modules_right "date_time"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
